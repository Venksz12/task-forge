apiVersion: apps/v1
kind: Deployment
metadata: {name: scheduler, namespace: taskforge}
spec:
  replicas: 1
  selector: {matchLabels: {app: scheduler}}
  template:
    metadata: {labels: {app: scheduler}}
    spec:
      containers:
      - {name: scheduler, image: taskforge/scheduler:latest, resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}}
